# Site config for the live deployment (e.g. /etc/nginx/conf.d/style-work.conf).
# Certificate paths are the ones certbot creates.

map $uri $style_work_cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
    listen 80;
    server_name style-work.brijeshhq.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name style-work.brijeshhq.com;

    ssl_certificate     /etc/letsencrypt/live/style-work.brijeshhq.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/style-work.brijeshhq.com/privkey.pem;

    root /var/www/style-work;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # No add_header at server (or http) level: the API sets its own headers with
    # helmet, and headers declared there would be sent twice on /api responses.
    location /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        # 'unsafe-inline' styles: sonner injects a <style> tag and the skeleton rows set inline widths.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Cache-Control $style_work_cache_control always;

        try_files $uri /index.html;

        location /assets/ {
            try_files $uri =404;
        }
    }
}
